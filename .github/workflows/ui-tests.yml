name: UI tests

on:
  repository_dispatch:
    types: [frontend-merged]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'   # match your project's TargetFramework

      - name: Run tests
        run: dotnet test
